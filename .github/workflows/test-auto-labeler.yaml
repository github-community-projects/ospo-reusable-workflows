---
name: "Test Auto Labeler"
on:
  # Fork pull requests get a read-only token and are labeled by hand. Avoids
  # pull_request_target, which hands a write token to runs for fork pull requests.
  pull_request:
    types: [opened, reopened, edited, synchronize]
permissions: {}
jobs:
  auto_labeler:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # Read the release-drafter config
      pull-requests: write # Apply labels to the pull request
      issues: write # Auto-create labels referenced in the autolabeler config
    uses: ./.github/workflows/auto-labeler.yaml
    with:
      config-name: release-drafter.yaml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
