## Reference: https://github.com/amannn/action-semantic-pull-request
---
name: "Lint PR Title"
on:
  workflow_call:
    inputs:
      types:
        required: false
        type: string
        default: |
          build
          chore
          ci
          docs
          feat
          fix
          perf
          refactor
          revert
          style
          test
      scopes:
        required: false
        type: string
        default: ""
      requireScope:
        required: false
        type: boolean
        default: false
    secrets:
      github-token:
        required: true
permissions: {}
jobs:
  main:
    permissions:
      contents: read # Read the repository for the semantic check
      pull-requests: read # Read the PR title
      statuses: write # Report the validation status
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.requireScope }}
