## Reference: https://github.com/amannn/action-semantic-pull-request
---
name: "Test Lint PR Title"
on:
  # The check only reads the title, so the read-only token fork pull requests
  # get is enough. Avoids pull_request_target, which hands them a write token.
  pull_request:
    types: [opened, reopened, edited, synchronize]
permissions: {}
jobs:
  lint_pr_title:
    permissions:
      contents: read # Read the repository for the semantic check
      pull-requests: read # Read the PR title
      statuses: write # Report the validation status
    uses: ./.github/workflows/pr-title.yaml
    with:
      types: |
        build
        chore
        ci
        docs
        feat
        fix
        perf
        refactor
        revert
        style
        test
      scopes: |
        ci
        docs
        deps
        github
        release
      requireScope: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
