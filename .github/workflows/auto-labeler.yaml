---
name: "Auto Labeler"
on:
  workflow_call:
    inputs:
      config-name:
        required: true
        type: string
    secrets:
      github-token:
        required: true
permissions: {}
jobs:
  main:
    permissions:
      # The autolabeler fetches the config file via the contents API,
      # which fails on private repositories without an explicit grant.
      contents: read
      pull-requests: write # Apply labels to the pull request
      issues: write # Auto-create labels referenced in the autolabeler config but missing from the repository
    name: Auto label pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: ${{ inputs.config-name }}
          token: ${{ secrets.github-token }}
