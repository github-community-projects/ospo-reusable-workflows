---
name: "Auto Labeler"
on:
  workflow_call:
    inputs:
      config-name:
        required: true
        type: string
    secrets:
      github-token:
        required: true
permissions: {}
jobs:
  main:
    permissions:
      # The autolabeler fetches the config file via the contents API,
      # which fails on private repositories without an explicit grant.
      contents: read
      pull-requests: write # Apply labels to the pull request
      issues: write # Auto-create labels referenced in the autolabeler config but missing from the repository
    name: Auto label pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: ${{ inputs.config-name }}
          token: ${{ secrets.github-token }}
