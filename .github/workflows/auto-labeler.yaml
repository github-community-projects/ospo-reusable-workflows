---
name: "Auto Labeler"
on:
  workflow_call:
    inputs:
      config-name:
        required: true
        type: string
    secrets:
      github-token:
        required: true
permissions: {}
jobs:
  main:
    permissions:
      # The autolabeler fetches the config file via the contents API,
      # which fails on private repositories without an explicit grant.
      contents: read
      pull-requests: write # Apply labels to the pull request
      issues: write # Auto-create labels referenced in the autolabeler config but missing from the repository
    name: Auto label pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: release-drafter/release-drafter/autolabeler@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          config-name: ${{ inputs.config-name }}
          token: ${{ secrets.github-token }}
