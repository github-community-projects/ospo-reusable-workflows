---
name: "Auto Labeler"
on:
  workflow_call:
    inputs:
      config-name:
        required: true
        type: string
    secrets:
      github-token:
        required: true
permissions: {}
jobs:
  main:
    permissions:
      # The autolabeler fetches the config file via the contents API,
      # which fails on private repositories without an explicit grant.
      contents: read
      pull-requests: write # Apply labels to the pull request
    name: Auto label pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: ${{ inputs.config-name }}
          token: ${{ secrets.github-token }}
