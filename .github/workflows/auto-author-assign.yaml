---
name: "Auto Author Assign"
# Fork pull requests get a read-only token, so the job skips them and
# maintainers assign the author by hand. Avoids pull_request_target, which
# hands a write token to runs for fork pull requests.
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  assign:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Assign the PR author
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
