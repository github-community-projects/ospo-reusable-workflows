---
name: "Auto Author Assign"
# Fork pull requests get a read-only token, so the job skips them and
# maintainers assign the author by hand. Avoids pull_request_target, which
# hands a write token to runs for fork pull requests.
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  assign:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Assign the PR author
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
