---
name: "Release Draft"
# Building block: evaluates release conditions, creates a draft release via
# release-drafter, and pushes the full and major version tags. Used by the
# release variant workflows (release-minimal, release-goreleaser,
# release-container) and callable directly for custom compositions. Pair with
# release-publish.yaml to publish the draft after your build jobs complete.
on:
  workflow_call:
    inputs:
      release-config-name:
        required: true
        type: string
      release-only-with-label:
        description: "Only create a release when the 'release' label is present on the PR. When true, other trigger labels (breaking, feature, vuln) are ignored."
        required: false
        type: boolean
        default: false
      version-file:
        description: "Path (relative to the repository root) to a file that holds the release version, for example VERSION, package.json, or Chart.yaml. When set, the version is read from this file instead of being resolved from PR labels."
        required: false
        type: string
        default: ""
      version-key:
        description: "yq expression that selects the version inside version-file, for example .version. Leave empty when version-file is plain text containing only the version."
        required: false
        type: string
        default: ""
    secrets:
      github-token:
        required: true
    outputs:
      should-release:
        description: "Whether release conditions were met"
        value: ${{ jobs.check_release.outputs.should-release }}
      full-tag:
        description: "Full tag of release"
        value: ${{ jobs.create_release.outputs.full-tag }}
      short-tag:
        description: "Short tag of release"
        value: ${{ jobs.create_release.outputs.short-tag }}
      body:
        description: "Body content of release"
        value: ${{ jobs.create_release.outputs.body }}
      release-id:
        description: "ID of the draft release"
        value: ${{ jobs.create_release.outputs.release-id }}

permissions: {}

jobs:
  check_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required by harden-runner
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Evaluate release conditions
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RELEASE_ONLY: ${{ inputs.release-only-with-label }}
        run: |
          should_release=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: releasing"
            should_release=true
          elif [ "$PR_MERGED" != "true" ]; then
            echo "PR not merged: skipping release"
          else
            IFS=',' read -ra labels <<< "${PR_LABELS,,}"
            if [ "$RELEASE_ONLY" = "true" ]; then
              for label in "${labels[@]}"; do
                if [ "$label" = "release" ]; then
                  should_release=true
                  break
                fi
              done
            else
              for label in "${labels[@]}"; do
                case "$label" in
                  breaking|feature|vuln|release)
                    should_release=true
                    break
                    ;;
                esac
              done
            fi
            echo "PR labels: ${PR_LABELS}, release-only-with-label: ${RELEASE_ONLY}, should-release: ${should_release}"
          fi

          echo "should-release=$should_release" >> "$GITHUB_OUTPUT"

  create_release:
    needs: check_release
    if: needs.check_release.outputs.should-release == 'true'
    outputs:
      full-tag: ${{ steps.release-drafter.outputs.tag_name }}
      short-tag: ${{ steps.get_tag_name.outputs.SHORT_TAG }}
      body: ${{ steps.release-drafter.outputs.body }}
      release-id: ${{ steps.release-drafter.outputs.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create draft release via release-drafter
      pull-requests: read # Read PR labels for release-drafter
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the base branch tip, not the fork PR head. Without an
          # explicit ref, pull_request_target defaults to refs/pull/N/merge,
          # which checkout v7 refuses as fork code. Pinning to merge_commit_sha
          # would also be refused (it is in the guard's blocklist), so the base
          # branch is the guard-safe choice.
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true # Required for git push of tags
      - name: Read version from file
        # Inline copy of scripts/resolve-version.sh. A reusable workflow runs in
        # the caller's checkout, so the script is not on disk here. The
        # test-scripts workflow fails if this block drifts from the script.
        id: version-file
        if: inputs.version-file != ''
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          VERSION_KEY: ${{ inputs.version-key }}
        run: |
          #!/usr/bin/env bash
          # Resolve a release version from a file in the repository.
          #
          # Usage: resolve-version.sh <version-file> [version-key]
          #
          #   version-file  Path to the file holding the version, relative to the
          #                 repository root.
          #   version-key   yq expression selecting the version inside a JSON, YAML, or
          #                 TOML file (for example .version). Omit for a plain-text file
          #                 whose first line is the version.
          #
          # Arguments may also be passed as VERSION_FILE and VERSION_KEY environment
          # variables, which is how the release workflows invoke the inline copy.
          #
          # Prints the bare semver (no leading v) on stdout, and writes version=<semver>
          # to GITHUB_OUTPUT when that variable is set. Exits non-zero with a ::error::
          # annotation on stderr when the file or key is missing, or when the value is
          # not a stable MAJOR.MINOR.PATCH version. Prerelease suffixes (1.2.3-rc.1) are
          # rejected because the release workflows have no prerelease handling: the
          # release would be marked latest and the major tag and image aliases would
          # move to it. Build metadata (1.2.3+build) is rejected because release-drafter's
          # version template drops it and Docker image tags cannot contain a plus sign.
          set -euo pipefail

          file="${1:-${VERSION_FILE:-}}"
          key="${2:-${VERSION_KEY:-}}"

          if [ -z "$file" ]; then
            echo "::error::usage: resolve-version.sh <version-file> [version-key]" >&2
            exit 1
          fi

          if [ ! -f "$file" ]; then
            echo "::error::version-file '$file' not found in the repository" >&2
            exit 1
          fi

          if [ -n "$key" ]; then
            if ! command -v yq >/dev/null 2>&1; then
              echo "::error::yq is required to read '$key' from '$file' but is not on PATH" >&2
              exit 1
            fi
            case "$file" in
              *.toml) raw=$(yq -p toml -o yaml "$key" "$file") ;;
              *) raw=$(yq -o yaml "$key" "$file") ;;
            esac
          else
            raw=$(head -n 1 "$file")
          fi

          # Trim leading and trailing whitespace only, so internal whitespace still
          # fails validation below.
          raw="${raw#"${raw%%[![:space:]]*}"}"
          raw="${raw%"${raw##*[![:space:]]}"}"

          if [ -z "$raw" ] || [ "$raw" = "null" ]; then
            echo "::error::no version found at '${key:-first line}' in '$file'" >&2
            exit 1
          fi

          # Tolerate a leading v; the tag-template in the release-drafter config adds
          # the prefix.
          version="${raw#v}"

          if [[ "$version" == *+* ]]; then
            echo "::error::version '$version' from '$file' contains build metadata, which is not supported (use MAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            echo "::error::version '$version' from '$file' is a prerelease, which is not supported (use MAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

          # semver.org grammar for the core version. Numeric identifiers cannot have
          # leading zeros.
          num='(0|[1-9][0-9]*)'
          semver="^${num}\\.${num}\\.${num}$"

          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::version '$version' from '$file' is not a valid semver (expected MAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

          printf '%s\n' "$version"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Find the first-release baseline
        # Inline copy of scripts/first-release-base.sh. Release Drafter finds
        # no changes when the repository has no published release, so on a
        # first release this outputs the root commit for its `from` input.
        id: first-release-base
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          #!/usr/bin/env bash
          # Print the comparison baseline Release Drafter needs for a first release.
          #
          # Usage: first-release-base.sh [repository]
          #
          # The repository (owner/name) may also be passed as the GITHUB_REPOSITORY
          # environment variable, which is how the release workflows invoke the inline
          # copy. Run it from a full (non-shallow) clone. Needs gh on PATH and a token in
          # GH_TOKEN.
          #
          # Release Drafter only lists changes since the last published release, so on a
          # repository with none it would write "No changes". When the repository has no
          # published (non-draft) release, this prints from=<root commit SHA>, which the
          # workflows pass as Release Drafter's `from` input so the first release lists
          # every pull request in history. Otherwise it prints an empty from=, and
          # Release Drafter compares against the last published release as usual. Writes
          # the same line to GITHUB_OUTPUT when that variable is set. Exits 1 when the API
          # call fails or the clone is shallow, so the caller fails closed instead of
          # guessing.
          set -euo pipefail

          repo="${1:-${GITHUB_REPOSITORY:-}}"

          if [ -z "$repo" ]; then
            echo "::error::usage: first-release-base.sh <owner/repo>" >&2
            exit 1
          fi

          # --paginate applies --jq to each page, so emit one line per published release
          # and test for any output, rather than reading a per-page length.
          if ! ids=$(gh api "repos/$repo/releases?per_page=100" --paginate --jq '.[] | select(.draft == false) | .id'); then
            echo "::error::could not list releases for $repo" >&2
            exit 1
          fi

          from=""
          if [ -z "$ids" ]; then
            # A shallow clone's root is the shallow boundary, not the first commit.
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              echo "::error::first release needs full history; check out with fetch-depth: 0" >&2
              exit 1
            fi
            # rev-list lists newest first; with several roots, use the oldest.
            from=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            echo "First release: comparing from root commit $from" >&2
          fi

          echo "from=$from"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "from=$from" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve release tag
        # Dry run of the draft step below: resolves tag_name without creating or
        # updating a release, so the tag check can fail before a draft exists.
        id: resolve-tag
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          config-name: ${{ inputs.release-config-name }}
          dry-run: true
          publish: false
          version: ${{ steps.version-file.outputs.version }}
          from: ${{ steps.first-release-base.outputs.from }}
          token: ${{ secrets.github-token }}
      - name: Check release tag
        # Inline copy of scripts/check-tag.sh. Verifies the tag release-drafter
        # resolved (honoring the caller's tag-template) does not already exist
        # at another commit, so the push below cannot move a released tag.
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag_name }}
        run: |
          #!/usr/bin/env bash
          # Verify that a release tag can be pushed without moving an existing tag.
          #
          # Usage: check-tag.sh <tag> [remote]
          #
          # Arguments may also be passed as TAG and REMOTE environment variables, which
          # is how the release workflows invoke the inline copy.
          #
          # Exits 0 when the tag does not exist on the remote, or when it already points
          # at HEAD (a re-run of a partially failed release). Exits 1 when the tag exists
          # and points elsewhere, or when the remote cannot be queried, so the caller
          # fails closed instead of force-pushing over a release.
          set -euo pipefail

          tag="${1:-${TAG:-}}"
          remote="${2:-${REMOTE:-origin}}"

          if [ -z "$tag" ]; then
            echo "::error::usage: check-tag.sh <tag> [remote]" >&2
            exit 1
          fi

          set +e
          output=$(git ls-remote --exit-code --tags "$remote" "refs/tags/$tag" "refs/tags/$tag^{}" 2>&1)
          status=$?
          set -e

          case "$status" in
            2)
              echo "Tag $tag does not exist on $remote"
              exit 0
              ;;
            0) ;;
            *)
              echo "::error::git ls-remote failed for $remote (exit $status): $output" >&2
              exit 1
              ;;
          esac

          # Prefer the peeled line (refs/tags/<tag>^{}) for annotated tags so we compare
          # the commit, not the tag object.
          remote_sha=$(printf '%s\n' "$output" | awk -v peeled="refs/tags/$tag^{}" -v plain="refs/tags/$tag" '
            $2 == peeled { print $1; found = 1; exit }
            $2 == plain && !found { sha = $1 }
            END { if (!found && sha) print sha }
          ')

          if [ -z "$remote_sha" ]; then
            echo "::error::could not parse git ls-remote output for $tag: $output" >&2
            exit 1
          fi

          head_sha=$(git rev-parse HEAD)

          if [ "$remote_sha" = "$head_sha" ]; then
            echo "Tag $tag already points at HEAD ($head_sha); re-run is safe"
            exit 0
          fi

          echo "::error::tag $tag already exists on $remote at $remote_sha (HEAD is $head_sha); bump the version before releasing" >&2
          exit 1
      - name: Draft release
        id: release-drafter
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          config-name: ${{ inputs.release-config-name }}
          publish: false
          version: ${{ steps.version-file.outputs.version }}
          from: ${{ steps.first-release-base.outputs.from }}
          token: ${{ secrets.github-token }}
      - name: Get the Short Tag
        id: get_tag_name
        env:
          FULL_TAG: ${{ steps.release-drafter.outputs.tag_name }}
        run: |
          short_tag=$(echo "$FULL_TAG" | cut -d. -f1)
          echo "SHORT_TAG=$short_tag" >> "$GITHUB_OUTPUT"
      - name: Create and push tags
        env:
          FULL_TAG: ${{ steps.release-drafter.outputs.tag_name }}
          SHORT_TAG: ${{ steps.get_tag_name.outputs.SHORT_TAG }}
        run: |
          git tag -f "$FULL_TAG"
          git tag -f "$SHORT_TAG" "$FULL_TAG"
          git push origin "$FULL_TAG"
          git push -f origin "$SHORT_TAG"
