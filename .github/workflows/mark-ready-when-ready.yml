name: Mark PR Ready When Ready

# Fork pull requests get a read-only token, so the job skips them and
# maintainers mark fork drafts ready by hand. Avoids pull_request_target, which
# hands a write token to runs for fork pull requests.
on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mark-ready:
    name: Mark as ready after successful checks
    runs-on: ubuntu-latest
    permissions:
      checks: read # Read check-run results
      contents: write # Required by the mark-ready action to update the PR
      pull-requests: write # Flip the PR out of draft
      statuses: read # Read commit statuses
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'Mark Ready When Ready') &&
      github.event.pull_request.draft == true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Mark ready when ready
        uses: kenyonj/mark-ready-when-ready@164bebf98862a24419165413a00bab80107b25ad # main (contents:write fix)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
