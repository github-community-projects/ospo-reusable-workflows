name: Mark PR Ready When Ready

# Uses pull_request_target so the mark-ready step gets a read-write token on
# fork PRs (pull_request hands forks a read-only token, so contents: write is
# denied and the job fails). Safe here: the workflow never checks out or
# executes PR-head code. The action reads the PR number, draft flag, labels,
# and head SHA from the event payload and acts only via the API, so running in
# the base-repo context does not evaluate any untrusted code.
on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mark-ready:
    name: Mark as ready after successful checks
    runs-on: ubuntu-latest
    permissions:
      checks: read # Read check-run results
      contents: write # Required by the mark-ready action to update the PR
      pull-requests: write # Flip the PR out of draft
      statuses: read # Read commit statuses
    if: |
      contains(github.event.pull_request.labels.*.name, 'Mark Ready When Ready') &&
      github.event.pull_request.draft == true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Mark ready when ready
        uses: kenyonj/mark-ready-when-ready@164bebf98862a24419165413a00bab80107b25ad # main (contents:write fix)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
